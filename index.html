<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>leha-os / links</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.github-header{background:#0d1117;border-bottom:1px solid #21262d}
.file-row{border-left:2px solid transparent}
.file-row:hover{border-left-color:#0969da;background:#f6f8fa}
.file-row.selected{background:#fff8c5;border-left-color:#d4a72c}
</style>
</head>
<body class="bg-white text-[#24292f] min-h-screen">
<div class="github-header text-white px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<svg height="32" width="32" viewBox="0 0 16 16" fill="white"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.04-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
<span class="font-semibold text-sm">leha-os / links <span class="ml-2 text-[11px] bg-[#1f6feb] px-2 py-0.5 rounded-full">PRIVATE</span></span>
</div>
<div class="flex items-center gap-2">
<span id="syncStatus" class="text-[11px] text-[#8b949e]">manual sync</span>
<div class="w-2 h-2 bg-[#2ea043] rounded-full animate-pulse"></div>
</div>
</div>

<div id="lock" class="max-w-3xl mx-auto px-6 py-16">
<div class="border border-[#d0d7de] rounded-md p-6">
<h2 class="text-[16px] font-semibold">🔒 Private access</h2>
<p class="text-[13px] text-[#57606a] mt-2">PIN + token stay in your browser only.</p>
<div class="mt-4 space-y-3">
<input id="pin" type="password" placeholder="Set PIN" class="w-full max-w-sm border rounded-md px-3 py-1.5 text-[14px]">
<input id="token" type="password" placeholder="GitHub token ghp_..." class="w-full max-w-sm border rounded-md px-3 py-1.5 text-[14px]">
<button id="unlock" class="bg-[#2ea043] text-white text-[14px] font-medium px-4 py-1.5 rounded-md">Unlock</button>
</div>
</div>
</div>

<div id="app" class="hidden">
<div class="max-w-[1024px] mx-auto px-4 py-4">
<div class="flex flex-wrap items-center justify-between gap-2 mb-3">
<div class="flex items-center gap-2">
<h2 class="font-semibold text-[14px]">Repositories</h2>
<span id="count" class="hidden">0 links</span>
</div>
<div class="flex flex-wrap gap-2 items-center">
<input id="search" placeholder="Filter..." class="border border-[#d0d7de] rounded-md px-3 py-1 text-[12px] w-32">
<button id="collapseAllBtn" class="text-[11px] border bg-white px-2.5 py-1 rounded-md">Collapse all</button>
<button id="openAllBtn" class="text-[11px] border bg-white px-2.5 py-1 rounded-md">Open all</button>
<button id="scanBtn" class="text-[11px] border bg-[#f6f8fa] px-3 py-1 rounded-md">Sync now</button>
</div>
</div>

<!-- bulk action bar -->
<div id="bulkBar" class="hidden border border-[#d4a72c] bg-[#fff8c5] rounded-md px-3 py-2 mb-3 flex flex-wrap items-center gap-2 text-[12px]">
<span id="bulkCount" class="font-medium">0 selected</span>
<button onclick="moveSelected()" class="bg-[#0d1117] text-white px-3 py-1 rounded-md">Move (sync thật)</button>
<button onclick="deleteSelected()" class="border bg-white px-3 py-1 rounded-md hover:bg-[#ffebe9]">Delete selected</button>
<button onclick="clearSelection()" class="text-[#57606a] px-2">Clear</button>
<span class="text-[11px] text-[#57606a]">→ chọn nhiều file rồi Move sẽ tạo file mới ở chỗ mới + xóa chỗ cũ trên Github thật</span>
</div>

<div class="border border-[#d0d7de] rounded-md overflow-hidden" id="out"></div>
</div>
</div>

<script>
let reposCache=[], allLinks=[], customNames=JSON.parse(localStorage.getItem('customNames')||'{}');
let selected = new Map(); // key -> {repo,path}
const $=s=>document.querySelector(s);
function getHeaders(){
 let t=localStorage.getItem('gh_token')||'';
 let h={'Accept':'application/vnd.github.v3+json'};
 if(t) h['Authorization']='token '+t;
 return h;
}
async function fetchContents(user, repo, path=''){
 let headers=getHeaders();
 let url=`https://api.github.com/repos/${user}/${repo}/contents/${path}?ref=main`;
 let res=await fetch(url,{headers});
 if(res.status===404){
  url=`https://api.github.com/repos/${user}/${repo}/contents/${path}?ref=master`;
  res=await fetch(url,{headers});
 }
 if(!res.ok) return [];
 let d=await res.json();
 return Array.isArray(d)?d:[];
}
async function scanAll(){
 let user='leha-os';
 let headers=getHeaders();
 let btn=document.getElementById('scanBtn');
 let oldText=btn?btn.innerText:'';
 if(btn){ btn.innerText='Syncing...'; btn.disabled=true; }
 try{
   let res=await fetch(`https://api.github.com/user/repos?per_page=100&sort=updated`,{headers});
   let repos=[];
   if(res.ok && localStorage.getItem('gh_token')){
     let data=await res.json();
     repos=data.filter(r=>r.owner.login.toLowerCase()==user.toLowerCase());
   }
   if(!repos.length){
     let r2=await fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=updated`,{headers});
     repos=await r2.json();
   }
   reposCache=repos;
   await renderRepos(repos);
 } finally {
   if(btn){ btn.innerText=oldText||'Sync now'; btn.disabled=false; }
 }
}
function toggleSelect(repo, path, key){
 let id=repo+'::'+path;
 if(selected.has(id)) selected.delete(id);
 else selected.set(id,{repo,path,key});
 updateBulkBar();
 // update row style
 document.querySelectorAll(`[data-sel="${CSS.escape(id)}"]`).forEach(el=>{
   if(selected.has(id)) el.classList.add('selected');
   else el.classList.remove('selected');
   let cb=el.querySelector('input[type=checkbox]');
   if(cb) cb.checked=selected.has(id);
 });
}
function updateBulkBar(){
 let bar=document.getElementById('bulkBar');
 let cnt=document.getElementById('bulkCount');
 if(selected.size===0){ bar.classList.add('hidden'); }
 else { bar.classList.remove('hidden'); cnt.innerText=selected.size+' selected'; }
}
function clearSelection(){ selected.clear(); updateBulkBar(); document.querySelectorAll('.file-row').forEach(r=>{ r.classList.remove('selected'); let cb=r.querySelector('input'); if(cb) cb.checked=false; }); }

async function renderRepos(repos){
 let filter=document.getElementById('search').value.toLowerCase();
 let out=$('#out'); if(!out) return;
 out.innerHTML=''; allLinks=[];
 for(let repo of repos){
   let user='leha-os';
   let root=await fetchContents(user, repo.name,'');
   let htmlFiles=root.filter(f=>f.type==='file' && f.name.toLowerCase().endsWith('.html'));
   let folders=root.filter(f=>f.type==='dir');
   let grouped={}; grouped['/']=[];
   htmlFiles.forEach(f=>{
     let pub=f.name.toLowerCase()=='index.html'?`https://${user}.github.io/${repo.name}/`:`https://${user}.github.io/${repo.name}/${f.name}`;
     if(!filter || f.name.toLowerCase().includes(filter) || repo.name.toLowerCase().includes(filter)){
       grouped['/'].push({label:f.name, path:`${repo.name}/${f.name}`, url:pub, key:`${repo.name}/${f.name}`, githubUrl:`https://github.com/${user}/${repo.name}/blob/main/${f.path}`, filePath:f.path, repo:repo.name});
       allLinks.push(pub);
     }
   });
   for(let folder of folders){
     let sub=await fetchContents(user, repo.name, folder.path);
     let subHtml=sub.filter(s=>s.type==='file' && s.name.toLowerCase().endsWith('.html'));
     if(!grouped[folder.path]) grouped[folder.path]=[];
     subHtml.forEach(file=>{
       let pub=file.name.toLowerCase()=='index.html'?`https://${user}.github.io/${repo.name}/${folder.path}/`:`https://${user}.github.io/${repo.name}/${folder.path}/${file.name}`;
       if(!filter || `${folder.path}/${file.name}`.toLowerCase().includes(filter) || repo.name.toLowerCase().includes(filter)){
         grouped[folder.path].push({label:file.name, path:`${repo.name}/${folder.path}/${file.name}`, url:pub, key:`${repo.name}/${folder.path}/${file.name}`, githubUrl:`https://github.com/${user}/${repo.name}/blob/main/${file.path}`, filePath:file.path, repo:repo.name});
         allLinks.push(pub);
       }
     });
   }
   let folderNames=Object.keys(grouped).filter(k=>grouped[k].length>0);
   if(folderNames.length===0 && filter) continue;
   let displayRepoName = repo.name;
   let section=document.createElement('div');
   section.className='border-b border-[#d0d7de] last:border-0';
   let isRepoCollapsed = localStorage.getItem('collapsed_'+repo.name);
   if(isRepoCollapsed===null) isRepoCollapsed='1';
   let repoCollapsed = isRepoCollapsed==='1';
   let totalFiles = folderNames.reduce((s,k)=>s+grouped[k].length,0);
   let foldersHtml = folderNames.map(folder=>{
     let files=grouped[folder];
     let folderKey = repo.name+'::'+folder;
     let isFolderCollapsed = localStorage.getItem('collapsed_folder_'+folderKey);
     if(isFolderCollapsed===null) isFolderCollapsed='1';
     let fCollapsed = isFolderCollapsed==='1';
     let folderLabel = folder==='/' ? '(root)' : folder;
     return `
     <div class="folder-group border-t border-[#eaeef2]">
       <div class="flex items-center gap-2 px-4 py-1.5 bg-white hover:bg-[#f6f8fa] cursor-pointer select-none pl-8" onclick="toggleFolder('${folderKey.replace(/'/g, "\'")}')">
         <span class="text-[11px]">${fCollapsed?'▸':'▾'}</span>
         <span class="text-[13px]">${folder==='/'?'🗂️':'📁'}</span>
         <span class="text-[12px] font-medium">${folderLabel}</span>
         <span class="text-[10px] text-[#8b949e]">${files.length} files</span>
       </div>
       <div class="folder-body ${fCollapsed?'hidden':''}" id="folder-${CSS.escape(folderKey)}">
         ${files.map(l=>{
           let selId=l.repo+'::'+l.filePath;
           let isSel=selected.has(selId);
           return `
           <div data-sel="${selId}" class="file-row ${isSel?'selected':''} flex items-center justify-between pl-8 pr-3 py-1.5 text-[12px] group border-t border-[#f6f8fa]">
             <div class="flex items-center gap-2 min-w-0 flex-1">
               <input type="checkbox" ${isSel?'checked':''} onchange="toggleSelect('${l.repo}','${l.filePath}','${l.key}')" class="w-3 h-3">
               <span class="text-[11px] text-[#8b949e]">↳</span>
               <span class="truncate" title="${l.path}">${l.label}</span>
               ${customNames[l.key]?`<span class="ml-2 text-[10px] bg-[#fff8c5] px-1 rounded">📝 ${customNames[l.key]}</span>`:''}
             </div>
             <div class="flex items-center gap-1">
               <a href="${l.url}" target="_blank" class="text-[11px] bg-[#0d1117] text-white px-2 py-0.5 rounded-md">OPEN</a>
               <a href="${l.githubUrl}" target="_blank" class="text-[11px] border bg-[#f6f8fa] px-2 py-0.5 rounded-md">Github</a>
               <button onclick="copyLink('${l.url}')" class="text-[11px] border bg-white px-2 py-0.5 rounded-md">Copy</button>
               <button onclick="editFile('${l.repo}','${l.filePath}')" class="text-[11px] border bg-[#fff8c5] px-2 py-0.5 rounded-md">Edit Real</button>
               <button onclick="deleteFile('${l.repo}','${l.filePath}')" class="text-[11px] border bg-white px-2 py-0.5 rounded-md hover:bg-[#ffebe9]">Del</button>
             </div>
           </div>
           `;
         }).join('')}
       </div>
     </div>
     `;
   }).join('');
   section.innerHTML=`
     <div class="repo-header px-3 py-2 bg-[#f6f8fa] flex items-center gap-2 cursor-pointer select-none" onclick="toggleRepo('${repo.name}')">
       <span class="text-[12px]">${repoCollapsed?'▸':'▾'}</span>
       <span class="font-semibold text-[13px] text-[#0969da]">${displayRepoName}</span>
       ${repo.private?'<span class="text-[10px] border rounded-full px-1.5">private</span>':''}
       
       <a href="https://${user}.github.io/${repo.name}/" target="_blank" class="ml-auto text-[11px] text-[#57606a] hover:text-[#0969da]" onclick="event.stopPropagation()">/${repo.name}/ →</a>
     </div>
     <div class="repo-body ${repoCollapsed?'hidden':''}" id="body-${repo.name}">
       ${foldersHtml || `<div class="pl-8 pr-3 py-2 text-[11px] text-[#8b949e]">No HTML files (only files with index.html will show usable link)</div>`}
     </div>
   `;
   out.appendChild(section);
 }
}
function toggleRepo(name){
 let body=document.getElementById('body-'+name);
 if(!body) return;
 let isHidden=body.classList.contains('hidden');
 body.classList.toggle('hidden');
 localStorage.setItem('collapsed_'+name, isHidden?'0':'1');
}
function toggleFolder(key){
 let id='folder-'+CSS.escape(key);
 let body=document.getElementById(id);
 if(!body) return;
 let isHidden=body.classList.contains('hidden');
 body.classList.toggle('hidden');
 localStorage.setItem('collapsed_folder_'+key, isHidden?'0':'1');
}
function copyLink(url){ navigator.clipboard.writeText(url); }
function collapseAll(){
 document.querySelectorAll('.repo-body').forEach(b=>b.classList.add('hidden'));
 document.querySelectorAll('.folder-body').forEach(b=>b.classList.add('hidden'));
 document.querySelectorAll('[id^="body-"]').forEach(b=>{ localStorage.setItem('collapsed_'+b.id.replace('body-',''),'1'); });
 // save folder collapsed
 document.querySelectorAll('.folder-group').forEach(g=>{
   let btn=g.querySelector('[onclick^="toggleFolder"]');
   if(btn){ let m=btn.getAttribute('onclick').match(/toggleFolder\('(.+)'\)/); if(m) localStorage.setItem('collapsed_folder_'+m[1],'1'); }
 });
}
function openAll(){
 document.querySelectorAll('.repo-body').forEach(b=>b.classList.remove('hidden'));
 document.querySelectorAll('.folder-body').forEach(b=>b.classList.remove('hidden'));
 document.querySelectorAll('[id^="body-"]').forEach(b=>{ localStorage.setItem('collapsed_'+b.id.replace('body-',''),'0'); });
 document.querySelectorAll('.folder-group').forEach(g=>{
   let btn=g.querySelector('[onclick^="toggleFolder"]');
   if(btn){ let m=btn.getAttribute('onclick').match(/toggleFolder\('(.+)'\)/); if(m) localStorage.setItem('collapsed_folder_'+m[1],'0'); }
 });
}
async function moveSelected(){
 if(selected.size===0) return;
 let token=localStorage.getItem('gh_token'); if(!token){ alert('Cần token có quyền repo để move thật'); return; }
 // check if multi-repo selection
 let repos=[...new Set([...selected.values()].map(v=>v.repo))];
 let targetRepo = repos.length===1 ? repos[0] : null;
 let newRepo = prompt(`Bạn đang chọn ${selected.size} file từ repo: ${repos.join(', ')}

Nhập repo đích (để trống = giữ nguyên repo cũ, nếu chọn nhiều repo khác nhau thì phải nhập repo đích chung):`, targetRepo||'');
 if(newRepo===null) return;
 if(!newRepo) newRepo=null; // keep original per file

 let targetFolder = prompt('Nhập folder đích (ví dụ: lab/ hoặc website/new/ hoặc để trống = root /):','lab/');
 if(targetFolder===null) return;
 targetFolder = targetFolder.trim();
 if(targetFolder && !targetFolder.endsWith('/')) targetFolder+='/';
 if(targetFolder==='/' ) targetFolder='';

 if(!confirm(`Move ${selected.size} file(s) tới ${newRepo?newRepo+'/':'(giữ repo cũ)'}${targetFolder||'(root)'} ? Đây là move thật trên Github (tạo file mới + xóa file cũ).`)) return;

 for(let [id, info] of selected){
   let destRepo = newRepo || info.repo;
   let fileName = info.path.split('/').pop();
   let destPath = targetFolder + fileName;
   try{
     // get source content
     let srcRes=await fetch(`https://api.github.com/repos/leha-os/${info.repo}/contents/${info.path}?ref=main`,{headers:getHeaders()});
     if(!srcRes.ok) srcRes=await fetch(`https://api.github.com/repos/leha-os/${info.repo}/contents/${info.path}?ref=master`,{headers:getHeaders()});
     if(!srcRes.ok){ alert('Không lấy được '+info.path); continue; }
     let srcData=await srcRes.json();
     // create at dest
     let createRes=await fetch(`https://api.github.com/repos/leha-os/${destRepo}/contents/${destPath}`,{
       method:'PUT',
       headers:{...getHeaders(),'Content-Type':'application/json'},
       body: JSON.stringify({message:`Move ${info.path} to ${destPath} via links manager`, content: srcData.content})
     });
     if(!createRes.ok){ alert('Tạo mới thất bại '+destPath+': '+(await createRes.text())); continue; }
     // delete source if different path/repo
     if(destRepo!==info.repo || destPath!==info.path){
       let delRes=await fetch(`https://api.github.com/repos/leha-os/${info.repo}/contents/${info.path}`,{
         method:'DELETE',
         headers:{...getHeaders(),'Content-Type':'application/json'},
         body: JSON.stringify({message:`Delete after move to ${destRepo}/${destPath}`, sha: srcData.sha})
       });
       if(!delRes.ok){ alert('Đã tạo mới nhưng xóa cũ thất bại: '+info.path); }
     }
   }catch(e){ alert('Lỗi move '+info.path+': '+e.message); }
 }
 alert('Move xong');
 clearSelection();
 scanAll();
}
async function deleteSelected(){
 if(selected.size===0) return;
 if(!confirm(`Xóa ${selected.size} file đã chọn trên Github thật? Không khôi phục được.`)) return;
 for(let [id, info] of selected){
   await deleteFile(info.repo, info.path, true);
 }
 clearSelection();
 scanAll();
}

document.getElementById('unlock').onclick=()=>{
 let pin=document.getElementById('pin').value.trim();
 if(!pin){ alert('Enter PIN'); return; }
 localStorage.setItem('leha_pin', pin);
 let token=document.getElementById('token').value.trim();
 if(token) localStorage.setItem('gh_token', token);
 document.getElementById('lock').classList.add('hidden');
 document.getElementById('app').classList.remove('hidden');
 scanAll();
};
document.getElementById('scanBtn').onclick=scanAll;
document.getElementById('collapseAllBtn').onclick=collapseAll;
document.getElementById('openAllBtn').onclick=openAll;
document.getElementById('search').addEventListener('input',()=>renderRepos(reposCache));
let savedPin=localStorage.getItem('leha_pin');
let savedToken=localStorage.getItem('gh_token');
if(savedPin){
 document.getElementById('pin').value=savedPin;
 if(savedToken) document.getElementById('token').value=savedToken;
 document.getElementById('lock').classList.add('hidden');
 document.getElementById('app').classList.remove('hidden');
 scanAll();
}
</script>

<div id="editModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-md border w-full max-w-2xl">
    <div class="px-4 py-2 border-b flex justify-between"><span id="editTitle" class="text-[13px] font-semibold">Edit</span><button onclick="closeModal()">X</button></div>
    <div class="p-4"><div id="editPath" class="text-[11px] text-[#57606a] mb-2"></div><textarea id="editContent" class="w-full h-[400px] border rounded p-3 text-[12px] font-mono"></textarea></div>
    <div class="px-4 py-2 border-t flex justify-end gap-2"><button onclick="closeModal()" class="border px-3 py-1 text-[12px] rounded">Cancel</button><button onclick="saveFile()" class="bg-[#2ea043] text-white px-3 py-1 text-[12px] rounded">Save</button></div>
  </div>
</div>
<script>
let curEdit={repo:null,path:null,sha:null};
async function editFile(repo,filePath){
 let token=localStorage.getItem('gh_token'); if(!token){alert('Need token');return;}
 let res=await fetch(`https://api.github.com/repos/leha-os/${repo}/contents/${filePath}?ref=main`,{headers:getHeaders()});
 if(!res.ok) res=await fetch(`https://api.github.com/repos/leha-os/${repo}/contents/${filePath}?ref=master`,{headers:getHeaders()});
 if(!res.ok){alert('Fetch failed '+res.status);return;}
 let data=await res.json();
 let content=atob(data.content.replace(/\n/g,''));
 curEdit={repo,path:filePath,sha:data.sha};
 document.getElementById('editTitle').innerText=filePath;
 document.getElementById('editPath').innerText=`leha-os/${repo}/${filePath}`;
 document.getElementById('editContent').value=content;
 document.getElementById('editModal').classList.remove('hidden');
}
function closeModal(){document.getElementById('editModal').classList.add('hidden');}
async function saveFile(){
 let txt=document.getElementById('editContent').value;
 let b64=btoa(unescape(encodeURIComponent(txt)));
 let res=await fetch(`https://api.github.com/repos/leha-os/${curEdit.repo}/contents/${curEdit.path}`,{method:'PUT',headers:{...getHeaders(),'Content-Type':'application/json'},body:JSON.stringify({message:`Edit ${curEdit.path} via links`,content:b64,sha:curEdit.sha})});
 if(res.ok){alert('Saved');closeModal();scanAll();} else {alert('Failed '+(await res.text()));}
}
async function deleteFile(repo,filePath, silent){
 let token=localStorage.getItem('gh_token'); if(!token){alert('Need token');return;}
 if(!silent && !confirm(`Delete ${repo}/${filePath}?`)) return;
 let r=await fetch(`https://api.github.com/repos/leha-os/${repo}/contents/${filePath}?ref=main`,{headers:getHeaders()});
 if(!r.ok) r=await fetch(`https://api.github.com/repos/leha-os/${repo}/contents/${filePath}?ref=master`,{headers:getHeaders()});
 if(!r.ok){if(!silent) alert('Cannot get sha');return;}
 let d=await r.json();
 let del=await fetch(`https://api.github.com/repos/leha-os/${repo}/contents/${filePath}`,{method:'DELETE',headers:{...getHeaders(),'Content-Type':'application/json'},body:JSON.stringify({message:`Delete ${filePath}`,sha:d.sha})});
 if(del.ok){if(!silent) {alert('Deleted'); scanAll();}} else {if(!silent) alert('Delete failed '+(await del.text()));}
}
</script>
</body>
</html>
